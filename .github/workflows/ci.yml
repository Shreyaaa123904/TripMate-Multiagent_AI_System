name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Pull PostgreSQL image for integration tests
        run: docker pull postgres:16-alpine

      # Unit, API, PostgreSQL integration, DB-recovery e2e and browser tests.
      # No secrets: LLM/search providers are faked; PostgreSQL runs in Docker.
      - name: Run tests
        env:
          TRIPMATE_REQUIRE_INTEGRATION: "1"
        run: pytest
